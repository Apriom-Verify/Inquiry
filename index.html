<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام مجوز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; padding: 15px; text-align: right; }
        .card { background: white; padding: 20px; border-radius: 10px; border: 2px solid #006633; max-width: 400px; margin: auto; }
        h2 { text-align: center; color: #006633; font-size: 18px; }
        .status { text-align: center; color: green; background: #e6ffe6; padding: 6px; border-radius: 5px; font-weight: bold; margin-bottom: 15px; }
        p { margin: 8px 0; border-bottom: 1px dashed #eee; padding-bottom: 5px; font-size: 14px; }
        span { font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>باشگاه تیراندازی آپریوم</h2>
        <div class="status">وضعیت مجوز: معتبر و فعال</div>
        <p><span>نام و نام خانوادگی:</span> فاطمه امیدوار همت آبادی</p>
        <p><span>کد ملی:</span> ۰۰۱۶۵۴۱۴۰۸</p>
        <p><span>نام پدر:</span> بمانعلی</p>
        <p><span>تاریخ تولد:</span> ۱۳۷۰/۰۷/۲۳</p>
        <p><span>نوع سلاح:</span> تفنگ بادی Walther CP99 (مشکی)</p>
        <p><span>شماره سریال:</span> 627768gh</p>
        <p><span>اعتبار:</span> صرفاً جهت استفاده در باشگاه آپریوم</p>
    </div>
</body>
</html>
