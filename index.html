<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه استعلام اصالت مجوز - باشگاه تیراندازی آپریوم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background: #0f172a; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { background-color: #ffffff; width: 100%; max-width: 450px; border-radius: 28px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); overflow: hidden; display: flex; flex-direction: column; }
        .header { background: #134e24; padding: 30px 20px; text-align: center; color: white; }
        .profile-img-container { width: 95px; height: 95px; margin: 0 auto 12px auto; border-radius: 50%; background-color: white; padding: 4px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
        .profile-img-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
        .header p { font-size: 0.8rem; opacity: 0.9; }
        .content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .status-box { background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; padding: 14px; border-radius: 14px; text-align: center; font-weight: 700; font-size: 0.95rem; }
        .personal-info-card { position: relative; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 18px; padding: 16px; overflow: hidden; }
        .personal-info-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('IMG_1123.jpeg'); background-size: cover; background-position: center; filter: grayscale(100%) contrast(120%) brightness(110%); opacity: 0.15; z-index: 1; }
        .personal-info-card > * { position: relative; z-index: 2; }
