<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه استعلام اصالت مجوز | باشگاه تیراندازی آپریوم</title>
<link href="[https://cdn.jsdelivr.net/gh/vazirmatn/vazirmatn@v33.003/Vazirmatn-font-face.css](https://cdn.jsdelivr.net/gh/vazirmatn/vazirmatn@v33.003/Vazirmatn-font-face.css)" rel="stylesheet" type="text/css" />
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: Vazirmatn, Tahoma, sans-serif;
}
body {
background: #0f172a;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}
.container {
width: 100%;
max-width: 450px;
background: rgba(255, 255, 255, 0.97);
border-radius: 20px;
box-shadow: 0 20px 40px rgba(0,0,0,0.5);
overflow: hidden;
border: 1px solid rgba(255, 255, 255, 0.4);
}
.header {
background: linear-gradient(135deg, #064e3b, #047857);
color: white;
padding: 25px 20px;
text-align: center;
}
.logo-box {
width: 90px;
height: 90px;
background: white;
border-radius: 50%;
margin: 0 auto 12px auto;
box-shadow: 0 4px 15px rgba(0,0,0,0.25);
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
padding: 4px;
}
.logo-box img {
width: 100%;
height: 100%;
object-fit: contain;
}
.header h1 {
font-size: 19px;
font-weight: 800;
margin-bottom: 4px;
}
.header p {
font-size: 11px;
opacity: 0.9;
}
.badge-verified {
background: #dcfce7;
color: #15803d;
border: 1px solid #86efac;
text-align: center;
padding: 10px;
margin: 15px 20px 5px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 14px;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
}
.badge-verified::before {
content: "✓";
display: inline-block;
width: 20px;
height: 20px;
background: #16a34a;
color: white;
border-radius: 50%;
line-height: 20px;
font-size: 12px;
}
.content {
padding: 20px;
}
.info-group {
display: flex;
justify-content: space-between;
padding: 9px 0;
border-bottom: 1px dashed #e2e8f0;
font-size: 13.5px;
}
.label {
color: #64748b;
font-weight: 500;
}
.value {
color: #0f172a;
font-weight: 700;
}
.section-box {
background: #f8fafc;
border: 1px solid #e2e8f0;
border-radius: 12px;
padding: 12px;
margin-top: 15px;
text-align: center;
}
.section-title {
font-size: 12.5px;
color: #475569;
font-weight: bold;
margin-bottom: 6px;
}
.custom-img {
max-width: 180px;
height: auto;
margin: 8px auto;
display: block;
border-radius: 8px;
filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15));
}
.footer-note {
background: #f1f5f9;
padding: 12px 18px;
text-align: center;
font-size: 11px;
color: #64748b;
border-top: 1px solid #e2e8f0;
line-height: 1.6;
}
</style>
</head>
